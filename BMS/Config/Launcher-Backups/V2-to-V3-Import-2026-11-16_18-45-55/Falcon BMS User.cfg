///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
// Configuration lines here will override settings in Falcon BMS.cfg; and this file will not be overwritten by future updates.
///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
set g_nAfterburnerDetentClick 10000 // Makes the clicks when the throttle passes the afterburner detent use the sound (index) identified by the value [Default is 0 (no sound)]
set g_bTacviewRealTime 1
set g_nRampMinutes 10
set g_nCampPeriodicSaveMinutes 0
set g_nTacPeriodicSaveMinutes 0

// LAUNCHER OVERRIDES BEGIN HERE - DO NOT EDIT OR ADD BELOW THIS LINE
set g_nButtonsPerDevice 128 // LAUNCHER OVERRIDE
set g_nHotasPinkyShiftMagnitude 640 // LAUNCHER OVERRIDE
set g_nNumOfPOVs 2 // LAUNCHER OVERRIDE
set g_nPOV1DeviceID 6 // LAUNCHER OVERRIDE
set g_nPOV1ID 0 // LAUNCHER OVERRIDE
set g_nPOV2DeviceID 5 // LAUNCHER OVERRIDE
set g_nPOV2ID 0 // LAUNCHER OVERRIDE
///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// SETUP OVERRIDE
// Configuration lines here will override settings in Falcon BMS.cfg and Falcon BMS User.cfg, when launched in VR or XR mode.// SETUP OVERRIDE
///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// SETUP OVERRIDE
set g_fVRZoom 2.0 // Reduce FOV by this factor, when zoomed in.// SETUP OVERRIDE
set g_nVRHMCSEYE 0 // HMCS renders, 0 right eye, 1 left eye, -1 both eyes.// SETUP OVERRIDE
set g_nVRExternalRenderingMode 0 // Rendering of outside-cockpit world - 0: mixed (default); 1: always mono; 2: always stereo// SETUP OVERRIDE
set g_fVRAltitudeFeetToRenderMono 30.0 // For 'mixed' rendering, the AGL transition altitude - below=stereo; above=mono (default: 30 ft)// SETUP OVERRIDE
set g_fVRResolution 1.0 // VR resolution multiplier.// SETUP OVERRIDE
set g_fVRIPDMultiplier 1.0 // VR interpupillary distance (IPD) factor.// SETUP OVERRIDE
set g_bVRParallelRenderThread 1 // Enable multi-threaded rendering for VR (1: higher throughput; 0: lower latency).// SETUP OVERRIDE
set g_bVRPredictFutureHeadMatrices 0 // Predict future head matrices for SteamVR. Only works with g_bVRParallelRenderThread enabled.// SETUP OVERRIDE
set g_bVRNoPresent 0 // This will not display the companion window in VR (only HMD will show image in 3d).// SETUP OVERRIDE
set g_bMixedRealityCockpitCoverEnabled 0 // Setting this will default the Mixed Reality Cockpit Cover on (1) or off (0). Can still be toggled in game.// SETUP OVERRIDE
set g_b3DClickableCursorFixToCenterIfVR 0 // Option to keep mouse cursor centered on display (use SimToggleCursorCenter to toggle this, in-flight)// SETUP OVERRIDE
///////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////// SETUP OVERRIDE
